<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aifute 5.0</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --bubble-ai: #f4f4f5;
    --bubble-user: #000000;
    --bubble-user-text: #ffffff;
    --border: #e5e5e5;
    --input-bg: #ffffff;
    --input-border: #d4d4d4;
    --accent: #ff7a00;
    --panel-bg: #fafafa;
    --hover: #f0f0f0;
    --meta: #999999;
    --error-bg: #ffe8e8;
    --error-text: #b00000;
    --error-border: #f3b8b8;
  }
  body.theme-dark {
    --bg: #121212;
    --text: #ffffff;
    --bubble-ai: #1e1e1e;
    --bubble-user: #ff7a00;
    --bubble-user-text: #000000;
    --border: #2a2a2a;
    --input-bg: #1e1e1e;
    --input-border: #333333;
    --panel-bg: #1a1a1a;
    --hover: #2a2a2a;
    --meta: #777777;
    --error-bg: #3a1a1a;
    --error-text: #ff8888;
    --error-border: #5a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    transition: background 0.2s, color 0.2s;
  }

  /* ШАПКА */
  header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 34px;
  }
  .menu-btn:hover { background: var(--hover); }
  .menu-btn span {
    display: block;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    width: 20px;
  }
  .logo-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .logo {
    display: inline-block;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ff7a00;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    user-select: none;
    position: relative;
  }
  body.theme-dark .logo { -webkit-text-stroke: 2px #fff; }
  .version {
    position: absolute;
    top: -4px;
    right: -42px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ff7a00;
    -webkit-text-stroke: 0.6px #000;
    paint-order: stroke fill;
    user-select: none;
    white-space: nowrap;
  }
  body.theme-dark .version { -webkit-text-stroke: 0.6px #fff; }

  .new-chat-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    border-radius: 50%;
    color: var(--accent);
    font-size: 24px;
    font-weight: 700;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.15s, transform 0.1s;
  }
  .new-chat-btn:hover { background: var(--hover); }
  .new-chat-btn:active { transform: scale(0.9); }

  /* БОКОВАЯ ПАНЕЛЬ */
  .sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 280px;
    height: 100vh;
    height: 100dvh;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    z-index: 300;
    display: flex;
    flex-direction: column;
    transition: left 0.3s ease;
    padding: 16px;
    overflow-y: auto;
  }
  .sidebar.open { left: 0; }
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .sidebar-title { font-size: 18px; font-weight: 700; }
  .close-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    font-size: 24px;
    padding: 4px 8px;
    border-radius: 6px;
    line-height: 1;
  }
  .close-btn:hover { background: var(--hover); }

  .accordion {
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .accordion-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .accordion-header:hover { background: var(--hover); }
  .accordion-header .arrow {
    font-size: 12px;
    color: var(--meta);
    transition: transform 0.2s;
    display: inline-block;
  }
  .accordion.open .accordion-header .arrow { transform: rotate(90deg); }
  .accordion-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .accordion.open .accordion-body { max-height: 5000px; }
  .accordion-content { padding: 8px 14px 14px; }

  .settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
  }
  .settings-row select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  .chat-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-item {
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    color: var(--text);
  }
  .chat-item:hover { background: var(--hover); }
  .chat-item.active { background: var(--accent); color: #000; font-weight: 600; }
  .chat-item .title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-item .mini-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--meta);
    font-size: 13px;
    padding: 2px 4px;
    line-height: 1;
    opacity: 0.6;
    border-radius: 4px;
    display: flex;
    align-items: center;
  }
  .chat-item .mini-btn:hover { opacity: 1; background: rgba(0,0,0,0.08); }
  .chat-item .mini-btn.del:hover { color: #ff4444; }
  .chat-item.active .mini-btn { color: #000; }
  .chat-item.active .mini-btn:hover { background: rgba(0,0,0,0.15); }
  .chat-item .mini-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 250;
    display: none;
  }
  .overlay.show { display: block; }

  /* ЧАТ */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .user-wrap, .ai-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 85%;
    animation: fadeIn 0.25s ease;
  }
  .user-wrap { align-self: flex-end; align-items: flex-end; }
  .ai-wrap { align-self: flex-start; align-items: flex-start; }
  .msg {
    padding: 11px 15px;
    border-radius: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .user {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 6px;
  }
  .ai {
    background: var(--bubble-ai);
    color: var(--text);
    border-bottom-left-radius: 6px;
  }
  .msg-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 4px;
    width: 100%;
  }
  .msg-actions { display: flex; align-items: center; gap: 2px; }
  .action-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0.55;
    transition: opacity 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--text);
    font-family: inherit;
  }
  .action-btn:hover { opacity: 1; background: var(--hover); }
  .action-btn.copied { color: var(--accent); opacity: 1; }
  .action-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .version-switcher {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    font-size: 12px;
    color: var(--meta);
    user-select: none;
  }
  .version-switcher button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    color: var(--meta);
    font-size: 14px;
    line-height: 1;
    font-family: inherit;
  }
  .version-switcher button:hover:not(:disabled) { color: var(--accent); }
  .version-switcher button:disabled { opacity: 0.3; cursor: not-allowed; }
  .version-switcher .counter { padding: 0 4px; }

  .sources-block {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255, 122, 0, 0.08);
    border: 1px solid rgba(255, 122, 0, 0.2);
    font-size: 12px;
  }
  .sources-block .src-title {
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .sources-block a {
    color: var(--text);
    text-decoration: none;
    display: block;
    padding: 3px 0;
    opacity: 0.8;
    line-height: 1.4;
  }
  .sources-block a:hover { opacity: 1; text-decoration: underline; color: var(--accent); }

  .typing { font-style: italic; color: var(--meta); }
  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 0.8s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* НИЖНЯЯ ПАНЕЛЬ */
  .toolbar {
    padding: 8px 14px 0;
    display: flex;
    gap: 8px;
    background: var(--bg);
  }
  .tool-btn {
    padding: 6px 12px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
    opacity: 0.6;
  }
  .tool-btn:hover { opacity: 1; }
  .tool-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    opacity: 1;
  }

  footer {
    padding: 8px 14px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
  }
  #question {
    flex: 1;
    padding: 13px 16px;
    font-size: 16px;
    border: 1.5px solid var(--input-border);
    border-radius: 24px;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    transition: border-color 0.15s;
    font-family: inherit;
  }
  #question:focus { border-color: var(--accent); }
  #question.edit-mode {
    border-color: var(--accent);
    background: rgba(255, 122, 0, 0.08);
  }
  #send {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    padding: 0;
  }
  #send:hover { background: #ff8c1a; }
  #send:active { transform: scale(0.93); }
  #send svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  #send .stop-icon {
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 3px;
    display: none;
  }
  #send.stopping .arrow-icon { display: none; }
  #send.stopping .stop-icon { display: block; }

  /* ТОСТ */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #000;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 400;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* МОДАЛКА */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--bg);
    color: var(--text);
    border-radius: 16px;
    padding: 20px;
    max-width: 340px;
    width: 100%;
    border: 2px solid var(--border);
  }
  .modal h3 { font-size: 16px; margin-bottom: 10px; }
  .modal p { font-size: 14px; margin-bottom: 16px; line-height: 1.4; }
  .modal input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 16px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 16px;
    border: 1.5px solid var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--text);
    font-family: inherit;
  }
  .modal-actions .primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .modal-actions .primary:hover { background: #ffa64d; }
  .modal-actions .danger { background: #ff4444; color: #fff; border-color: #ff4444; }
  .modal-actions .danger:hover { background: #cc0000; }
</style>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn" aria-label="Меню">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="logo-wrap">
    <span class="logo">Aifute<span class="version">5.0</span></span>
  </div>
  <button class="new-chat-btn" id="newChatBtn" title="Новый чат">+</button>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Меню</div>
    <button class="close-btn" id="closeBtn">×</button>
  </div>

  <div class="accordion" id="settingsAccordion">
    <div class="accordion-header" id="settingsHeader">
      <span>⚙️ Настройки</span>
      <span class="arrow">▶</span>
    </div>
    <div class="accordion-body">
      <div class="accordion-content">
        <div class="settings-row">
          <span>Язык ответа</span>
          <select id="langSelect">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="settings-row">
          <span>Тема</span>
          <select id="themeSelect">
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="accordion" id="folderAccordion">
    <div class="accordion-header" id="folderHeader">
      <span>📁 Папка чатов (<span id="chatCount">0</span>/100)</span>
      <span class="arrow">▶</span>
    </div>
    <div class="accordion-body">
      <div class="accordion-content">
        <div class="chat-list" id="chatList"></div>
      </div>
    </div>
  </div>
</aside>

<div id="chat">
  <div class="ai-wrap">
    <div class="msg ai">Привет! Я Aifute 5.0. Теперь я умею думать глубже и искать в интернете. Спрашивай что угодно.</div>
  </div>
</div>

<div class="toolbar">
  <button class="tool-btn" id="thinkingBtn" title="Режим раздумий">🤔 Раздумие</button>
  <button class="tool-btn" id="searchBtn" title="Поиск в интернете">🔍 Поиск</button>
</div>

<footer>
  <input id="question" type="text" placeholder="Спроси что-нибудь..." autocomplete="off">
  <button id="send" aria-label="Отправить">
    <svg class="arrow-icon" viewBox="0 0 24 24">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="6 11 12 5 18 11"></polyline>
    </svg>
    <div class="stop-icon"></div>
  </button>
</footer>

<div class="toast" id="toast">Скопировано</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Заголовок</h3>
    <p id="modalText" style="display:none;"></p>
    <input id="modalInput" type="text" style="display:none;">
    <div class="modal-actions">
      <button id="modalCancel">Отмена</button>
      <button id="modalConfirm" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // НАСТРОЙКИ
  // ============================================================
  const API_KEY = 'AQ.Ab8RN6LSEw3ZaDsfmwZ3nn2Y-3_vLr7sY-M2Cr4AlkT1I8LZtA';
  const MODEL = 'gemini-3.1-flash-lite';
  const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent';

  const SEARCH_PROXY = 'https://aifute-search-23.vovacher14-star.deno.net';

  const MAX_CHATS = 100;
  const RETRY_DELAYS_MS = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000];
  const MAX_RETRIES = RETRY_DELAYS_MS.length;
  const CHARS_PER_TICK = 2;
  const TICK_MS = 18;

  const SYSTEM_PROMPTS = {
    ru: 'Ты Aifute — дружелюбный, умный и заботливый ИИ-ассистент. Отвечай на русском языке, понятно и по делу. Если вопрос сложный — объясняй пошагово. Если пользователь грустит — поддержи его. Будь как старший друг: умный, но не занудный.',
    en: 'You are Aifute — a friendly, smart and caring AI assistant. Always reply in English, clearly and to the point. If the question is complex, explain step by step. If the user is sad, support them. Be like an older friend: smart but not boring.'
  };

  const SEARCH_PROMPT_ADDON = '\n\nНиже приведены результаты поиска в интернете по вопросу пользователя. Используй их как источник актуальной информации. Если результаты не относятся к вопросу — игнорируй их. Отвечай, опираясь на них, но своими словами.';

  // ============================================================
  // СОСТОЯНИЕ
  // ============================================================
  let chats = [];
  let activeChatId = null;
  let currentAbort = null;
  let editingIndex = -1;

  // Режимы
  let thinkingMode = false;
  let searchMode = false;

  const chatEl = document.getElementById('chat');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send');
  const toast = document.getElementById('toast');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const chatList = document.getElementById('chatList');
  const chatCount = document.getElementById('chatCount');
  const langSelect = document.getElementById('langSelect');
  const themeSelect = document.getElementById('themeSelect');
  const modalBg = document.getElementById('modalBg');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalInput = document.getElementById('modalInput');
  const modalConfirm = document.getElementById('modalConfirm');
  const modalCancel = document.getElementById('modalCancel');
  const thinkingBtn = document.getElementById('thinkingBtn');
  const searchBtn = document.getElementById('searchBtn');

  // ============================================================
  // LOCALSTORAGE
  // ============================================================
  function saveChats() {
    try {
      localStorage.setItem('aifute_chats', JSON.stringify(chats));
      localStorage.setItem('aifute_active', activeChatId || '');
    } catch (e) { console.error('Save error:', e); }
  }
  function loadChats() {
    try {
      const raw = localStorage.getItem('aifute_chats');
      if (raw) chats = JSON.parse(raw);
      const active = localStorage.getItem('aifute_active');
      if (active) activeChatId = active;
    } catch (e) { chats = []; }
  }
  function saveSettings() {
    localStorage.setItem('aifute_lang', langSelect.value);
    localStorage.setItem('aifute_theme', themeSelect.value);
    localStorage.setItem('aifute_thinking', thinkingMode ? '1' : '0');
    localStorage.setItem('aifute_search', searchMode ? '1' : '0');
  }
  function loadSettings() {
    const lang = localStorage.getItem('aifute_lang') || 'ru';
    const theme = localStorage.getItem('aifute_theme') || 'light';
    thinkingMode = localStorage.getItem('aifute_thinking') === '1';
    searchMode = localStorage.getItem('aifute_search') === '1';
    langSelect.value = lang;
    themeSelect.value = theme;
    applyTheme(theme);
    updateToolButtons();
  }
  function applyTheme(theme) {
    if (theme === 'dark') document.body.classList.add('theme-dark');
    else document.body.classList.remove('theme-dark');
  }

  function updateToolButtons() {
    thinkingBtn.classList.toggle('active', thinkingMode);
    searchBtn.classList.toggle('active', searchMode);
  }

  // ============================================================
  // ЧАТЫ
  // ============================================================
  function createNewChat() {
    if (chats.length >= MAX_CHATS) {
      showModal({
        title: 'Лимит чатов',
        text: 'Достигнут максимум — ' + MAX_CHATS + ' чатов. Удали один из старых, чтобы создать новый.',
        confirmLabel: 'Понятно',
        onConfirm: () => {}
      });
      return null;
    }
    const newChat = {
      id: 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      title: 'Новый чат',
      messages: []
    };
    chats.push(newChat);
    activeChatId = newChat.id;
    saveChats();
    renderChatList();
    renderActiveChat();
    return newChat;
  }

  function switchChat(id) {
    if (id === activeChatId) return;
    activeChatId = id;
    editingIndex = -1;
    input.value = '';
    input.classList.remove('edit-mode');
    input.placeholder = 'Спроси что-нибудь...';
    saveChats();
    renderChatList();
    renderActiveChat();
    closeSidebar();
  }

  function deleteChat(id) {
    const idx = chats.findIndex(c => c.id === id);
    if (idx === -1) return;
    chats.splice(idx, 1);
    if (activeChatId === id) {
      activeChatId = chats.length > 0 ? chats[0].id : null;
    }
    saveChats();
    renderChatList();
    renderActiveChat();
    if (chats.length === 0) createNewChat();
  }

  function renameChat(id, newTitle) {
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    chat.title = newTitle.slice(0, 50);
    saveChats();
    renderChatList();
  }

  function getActiveChat() {
    return chats.find(c => c.id === activeChatId);
  }

  // ============================================================
  // РЕНДЕР
  // ============================================================
  function renderChatList() {
    chatList.innerHTML = '';
    chatCount.textContent = chats.length;
    chats.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = c.title || 'Без названия';
      item.appendChild(title);

      const renameBtn = document.createElement('button');
      renameBtn.className = 'mini-btn';
      renameBtn.title = 'Переименовать';
      renameBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>';
      renameBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showModal({
          title: 'Переименовать чат',
          inputValue: c.title || '',
          confirmLabel: 'Сохранить',
          onConfirm: (val) => {
            const trimmed = (val || '').trim();
            if (trimmed) renameChat(c.id, trimmed);
          }
        });
      });
      item.appendChild(renameBtn);

      const del = document.createElement('button');
      del.className = 'mini-btn del';
      del.title = 'Удалить';
      del.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        showModal({
          title: 'Удалить чат?',
          text: '«' + (c.title || 'Без названия') + '» будет удалён навсегда.',
          confirmLabel: 'Удалить',
          danger: true,
          onConfirm: () => deleteChat(c.id)
        });

  function renderActiveChat() {
    chatEl.innerHTML = '';
    const chat = getActiveChat();
    if (!chat || chat.messages.length === 0) {
      const wrap = document.createElement('div');
      wrap.className = 'ai-wrap';
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.textContent = 'Привет! Я Aifute 5.0. Теперь я умею думать глубже и искать в интернете. Спрашивай что угодно.';
      wrap.appendChild(div);
      chatEl.appendChild(wrap);
      return;
    }
    chat.messages.forEach((m, i) => {
      renderUserMessage(i);
      if (m.versions.length > 0) renderAIMessage(i);
    });
  }

  function renderUserMessage(index) {
    const chat = getActiveChat();
    const data = chat.messages[index];
    const wrap = document.createElement('div');
    wrap.className = 'user-wrap';
    wrap.dataset.userIndex = index;

    const bubble = document.createElement('div');
    bubble.className = 'msg user';
    bubble.textContent = data.text;
    wrap.appendChild(bubble);

    const footer = document.createElement('div');
    footer.className = 'msg-footer';
    footer.appendChild(createActionsBlock(data.text, () => startEditing(index), null));
    wrap.appendChild(footer);

    chatEl.appendChild(wrap);
  }

  function renderAIMessage(index) {
    const chat = getActiveChat();
    const data = chat.messages[index];
    const wrap = document.createElement('div');
    wrap.className = 'ai-wrap';
    wrap.dataset.aiIndex = index;

    const bubble = document.createElement('div');
    bubble.className = 'msg ai';
    bubble.textContent = data.versions[data.activeVersion];

    // Источники
    if (data.sources && data.sources.length > 0) {
      const srcBlock = document.createElement('div');
      srcBlock.className = 'sources-block';
      const st = document.createElement('div');
      st.className = 'src-title';
      st.textContent = 'Источники:';
      srcBlock.appendChild(st);
      data.sources.slice(0, 5).forEach(s => {
        const a = document.createElement('a');
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = s.title || s.url;
        srcBlock.appendChild(a);
      });
      bubble.appendChild(srcBlock);
    }

    wrap.appendChild(bubble);

    const footer = document.createElement('div');
    footer.className = 'msg-footer';
    const currentText = data.versions[data.activeVersion];
    footer.appendChild(createActionsBlock(currentText, null, () => shareText(currentText)));

    if (data.versions.length > 1) {
      const switcher = document.createElement('div');
      switcher.className = 'version-switcher';

      const prevBtn = document.createElement('button');
      prevBtn.innerHTML = '&#8249;';
      prevBtn.disabled = data.activeVersion === 0;
      prevBtn.addEventListener('click', () => {
        if (data.activeVersion > 0) {
          data.activeVersion--;
          saveChats();
          redrawAIMessage(index);
        }
      });

      const counter = document.createElement('span');
      counter.className = 'counter';
      counter.textContent = (data.activeVersion + 1) + ' / ' + data.versions.length;

      const nextBtn = document.createElement('button');
      nextBtn.innerHTML = '&#8250;';
      nextBtn.disabled = data.activeVersion === data.versions.length - 1;
      nextBtn.addEventListener('click', () => {
        if (data.activeVersion < data.versions.length - 1) {
          data.activeVersion++;
          saveChats();
          redrawAIMessage(index);
        }
      });

      switcher.appendChild(prevBtn);
      switcher.appendChild(counter);
      switcher.appendChild(nextBtn);
      footer.appendChild(switcher);
    }

    wrap.appendChild(footer);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function redrawAIMessage(index) {
    const old = chatEl.querySelector('.ai-wrap[data-ai-index="' + index + '"]');
    if (old) old.remove();
    const userWrap = chatEl.querySelector('.user-wrap[data-user-index="' + index + '"]');
    if (userWrap) {
      const temp = document.createElement('div');
      userWrap.insertAdjacentElement('afterend', temp);
      renderAIMessage(index);
      const newAI = chatEl.lastElementChild;
      temp.replaceWith(newAI);
    }
  }

  function createActionsBlock(text, onEdit, onShare) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'action-btn';
    copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>Копировать</span>';
    copyBtn.addEventListener('click', async () => {
      const ok = await copyText(text);
      if (ok) {
        showToast('Скопировано');
        copyBtn.classList.add('copied');
        const span = copyBtn.querySelector('span');
        span.textContent = 'Скопировано';
        setTimeout(() => { span.textContent = 'Копировать'; copyBtn.classList.remove('copied'); }, 1200);
      }
    });
    actions.appendChild(copyBtn);

    if (onEdit) {
      const editBtn = document.createElement('button');
      editBtn.className = 'action-btn';
      editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg><span>Изменить</span>';
      editBtn.addEventListener('click', onEdit);
      actions.appendChild(editBtn);

    if (onShare) {
      const shareBtn = document.createElement('button');
      shareBtn.className = 'action-btn';
      shareBtn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>Поделиться</span>';
      shareBtn.addEventListener('click', onShare);
      actions.appendChild(shareBtn);
    }

    return actions;
  }

  // ============================================================
  // ВСПОМОГАТЕЛЬНЫЕ
  // ============================================================
  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  async function shareText(text) {
    if (navigator.share) {
      try { await navigator.share({ text: text }); return true; }
      catch (e) { return false; }
    } else {
      const ok = await copyText(text);
      if (ok) showToast('Скопировано');
      return ok;
    }
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function fetchWithTimeout(url, options, ms, signal) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    if (signal) signal.addEventListener('abort', () => controller.abort());
    return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  let currentModalHandler = null;
  function showModal({ title, text, inputValue, confirmLabel, danger, onConfirm }) {
    modalTitle.textContent = title;
    if (text) { modalText.textContent = text; modalText.style.display = ''; }
    else modalText.style.display = 'none';

    if (inputValue !== undefined) {
      modalInput.value = inputValue;
      modalInput.style.display = '';
      setTimeout(() => { modalInput.focus(); modalInput.select(); }, 50);
    } else {
      modalInput.style.display = 'none';
    }

    modalConfirm.textContent = confirmLabel || 'OK';
    modalConfirm.className = danger ? 'danger' : 'primary';

    currentModalHandler = onConfirm;
    modalBg.classList.add('show');
  }
  function closeModal() { modalBg.classList.remove('show'); currentModalHandler = null; }
  modalCancel.addEventListener('click', closeModal);
  modalConfirm.addEventListener('click', () => {
    if (currentModalHandler) {
      const val = modalInput.style.display !== 'none' ? modalInput.value : null;
      currentModalHandler(val);
    }
    closeModal();
  });
  modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });
  modalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); modalConfirm.click(); }
  });

  // РЕЖИМЫ (Раздумие / Поиск)
  // ============================================================
  thinkingBtn.addEventListener('click', () => {
    thinkingMode = !thinkingMode;
    updateToolButtons();
    saveSettings();
    showToast(thinkingMode ? 'Раздумие включено' : 'Раздумие выключено');
  });
  searchBtn.addEventListener('click', () => {

  // ============================================================
  // ПОИСК
  // ============================================================
  async function webSearch(query, externalSignal) {
    const url = SEARCH_PROXY + '/?q=' + encodeURIComponent(query);
    const response = await fetchWithTimeout(url, { method: 'GET' }, 15000, externalSignal);
    if (!response.ok) throw new Error('Search HTTP ' + response.status);
    const data = await response.json();
    return data.results || [];
  }

  function buildSearchContext(results) {
    if (!results || results.length === 0) return '';
    let ctx = SEARCH_PROMPT_ADDON + '\n\n';
    results.slice(0, 8).forEach((r, i) => {
      ctx += (i + 1) + '. ' + r.title + '\n';
      ctx += '   URL: ' + r.url + '\n';
      if (r.snippet) ctx += '   ' + r.snippet + '\n';
      ctx += '\n';
    });
    return ctx;
  }

  // ============================================================
  // РЕДАКТИРОВАНИЕ
  // ============================================================
  function startEditing(index) {
    if (currentAbort) return;
    if (editingIndex !== -1) cancelEditing();
    const chat = getActiveChat();
    if (!chat) return;
    editingIndex = index;
    const data = chat.messages[index];
    input.value = data.text;
    input.classList.add('edit-mode');
    input.placeholder = 'Редактирование... нажми стрелку чтобы отправить';
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
  function cancelEditing() {
    editingIndex = -1;
    input.value = '';
    input.classList.remove('edit-mode');
    input.placeholder = 'Спроси что-нибудь...';
  }

  // ============================================================
  // ЗАПРОС К GEMINI
  // ============================================================
  function buildContents(messages, question, searchContext) {
    const contents = [];
    for (let i = 0; i < messages.length; i++) {
      const m = messages[i];
      const userText = (m.text || '').trim();
      if (userText === '') continue;
      const activeAnswer = m.versions && m.versions[m.activeVersion];
      const aiText = (activeAnswer || '').trim();
      if (aiText === '') continue;
      contents.push({ role: 'user', parts: [{ text: userText }] });
      contents.push({ role: 'model', parts: [{ text: aiText }] });
    }
    let finalQ = (question || '').trim();
    if (searchContext) finalQ = finalQ + '\n\n' + searchContext;
    if (finalQ !== '') contents.push({ role: 'user', parts: [{ text: finalQ }] });
    return contents;
  }

  async function askGeminiOnce(question, searchContext, externalSignal) {
    const chat = getActiveChat();
    if (!chat) throw new Error('Нет активного чата');

    const contents = buildContents(chat.messages, question, searchContext);
    if (contents.length === 0) throw new Error('Нет сообщений для отправки');

    const prompt = SYSTEM_PROMPTS[langSelect.value] || SYSTEM_PROMPTS.ru;

    const generationConfig = { maxOutputTokens: 4096 };
    if (thinkingMode) {
      generationConfig.thinkingConfig = { thinkingBudget: -1 };
    } else {
      generationConfig.thinkingConfig = { thinkingBudget: 0 };
    }

    const response = await fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': API_KEY
      },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: prompt }] },
        contents: contents,
        generationConfig: generationConfig
      })
    }, 120000, externalSignal);

    if (!response.ok) {
      const err = await response.text();
      const error = new Error('HTTP ' + response.status + ': ' + err.slice(0, 300));
      error.status = response.status;
      throw error;
    }

    const data = await response.json();
    const partsArr = data?.candidates?.[0]?.content?.parts;
    let answer = '';
    if (Array.isArray(partsArr)) {
      for (const p of partsArr) {
        if (typeof p?.text === 'string' && p.text.length > 0) answer += p.text;
      }
    }
    if (!answer.trim()) {
      const reason = data?.candidates?.[0]?.finishReason || 'пусто';
      throw new Error('Пустой ответ (причина: ' + reason + ')');
    }
    return answer;
  }

  async function askGeminiWithRetry(question, searchContext, externalSignal) {
    let lastError = null;
    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      if (externalSignal?.aborted) throw new Error('Остановлено');
      try {
        return await askGeminiOnce(question, searchContext, externalSignal);
      } catch (e) {
        if (e.name === 'AbortError' || e.message === 'Остановлено') throw e;
        const status = e.status;
        const isRetryable = status === 429 || status === 503 || status === 500 || status === 408;
        if (!isRetryable) throw e;
        lastError = e;
        if (attempt === MAX_RETRIES) break;
        await sleep(RETRY_DELAYS_MS[attempt]);
      }
    }
    throw lastError || new Error('Все попытки исчерпаны');
  }

  // ============================================================
  // ОТПРАВКА
  // ============================================================
  function setSendingState(isSending) {
    if (isSending) sendBtn.classList.add('stopping');
    else sendBtn.classList.remove('stopping');
  }

  function typewriterEffect(div, fullText, signal) {
    return new Promise((resolve) => {
      let index = 0;
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      div.textContent = '';
      div.appendChild(cursor);
      const textNode = document.createTextNode('');
      div.insertBefore(textNode, cursor);
      function tick() {
        if (signal?.aborted || index >= fullText.length) {
          cursor.remove();
          div.textContent = fullText;
          resolve();
          return;
        }
        index = Math.min(index + CHARS_PER_TICK, fullText.length);
        textNode.textContent = fullText.slice(0, index);
        chatEl.scrollTop = chatEl.scrollHeight;
        setTimeout(tick, TICK_MS);
      }
      tick();
    });
  }

  async function sendMessage(text) {
    const trimmed = (text || '').trim();
    if (!trimmed || currentAbort) return;

    let chat = getActiveChat();
    if (!chat) {
      chat = createNewChat();
      if (!chat) return;
    }

    // Редактирование
    if (editingIndex !== -1) {
      const editIdx = editingIndex;
      const aiWrap = chatEl.querySelector('.ai-wrap[data-ai-index="' + editIdx + '"]');
      if (aiWrap) aiWrap.remove();
      while (chat.messages.length > editIdx + 1) {
        const last = chat.messages.length - 1;
        const w = chatEl.querySelector('.user-wrap[data-user-index="' + last + '"]');
        if (w) w.remove();
        const a = chatEl.querySelector('.ai-wrap[data-ai-index="' + last + '"]');
        if (a) a.remove();
        chat.messages.pop();
      }
      chat.messages[editIdx].text = trimmed;
      const userWrap = chatEl.querySelector('.user-wrap[data-user-index="' + editIdx + '"]');
      if (userWrap) {
        const bubble = userWrap.querySelector('.msg.user');
        if (bubble) bubble.textContent = trimmed;
      }
      cancelEditing();
    } else {
      chat.messages.push({ text: trimmed, versions: [], activeVersion: 0, sources: [] });
      renderUserMessage(chat.messages.length - 1);
      if (chat.messages.length === 1) {
        chat.title = trimmed.slice(0, 30) + (trimmed.length > 30 ? '...' : '');
        renderChatList();
      }
    }

    saveChats();
    input.value = '';
    input.focus();

    const idx = chat.messages.length - 1;

    // Пустой AI-блок
    const aiWrap = document.createElement('div');
    aiWrap.className = 'ai-wrap';
    aiWrap.dataset.aiIndex = idx;
    const bubble = document.createElement('div');
    bubble.className = 'msg ai typing';
    bubble.textContent = searchMode ? 'Aifute ищет в интернете...' : 'Aifute думает...';
    aiWrap.appendChild(bubble);
    chatEl.appendChild(aiWrap);
    chatEl.scrollTop = chatEl.scrollHeight;

    setSendingState(true);
    currentAbort = new AbortController();

    let searchResults = [];

    try {
      // 1. Поиск в интернете (если включён)
      if (searchMode) {
        try {
          bubble.textContent = 'Aifute ищет в интернете...';
          searchResults = await webSearch(trimmed, currentAbort.signal);
          console.log('Search results:', searchResults.length);
        } catch (e) {
          console.warn('Search failed:', e);
          searchResults = [];
        }
        if (currentAbort.signal.aborted) throw new Error('Остановлено');
        bubble.textContent = thinkingMode ? 'Aifute думает глубже...' : 'Aifute думает...';
      } else {
        bubble.textContent = thinkingMode ? 'Aifute думает глубже...' : 'Aifute думает...';
      }

      // 2. Запрос к Gemini
      const searchContext = buildSearchContext(searchResults);
      const answer = await askGeminiWithRetry(trimmed, searchContext, currentAbort.signal);

      chat.messages[idx].versions.push(answer);
      chat.messages[idx].activeVersion = chat.messages[idx].versions.length - 1;
      chat.messages[idx].sources = searchResults;
      saveChats();

      bubble.classList.remove('typing');
      await typewriterEffect(bubble, answer, currentAbort.signal);

      aiWrap.remove();
      renderAIMessage(idx);
    } catch (e) {
      bubble.classList.remove('typing');
      bubble.classList.add('error');
      if (e.name === 'AbortError' || e.message === 'Остановлено') bubble.textContent = '⏹ Остановлено';
      else bubble.textContent = 'Ошибка: ' + e.message;
      console.error(e);
    } finally {
      currentAbort = null;
      setSendingState(false);
      input.focus();
    }
  }

  // ============================================================
  // СОБЫТИЯ
  // ============================================================
  function ask() {
    const q = input.value.trim();
    if (!q) return;
    sendMessage(q);
  }
  sendBtn.addEventListener('click', () => {
    if (currentAbort) currentAbort.abort();
    else ask();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') ask();
    if (e.key === 'Escape' && editingIndex !== -1) cancelEditing();
  });
  langSelect.addEventListener('change', saveSettings);
  themeSelect.addEventListener('change', () => {
    applyTheme(themeSelect.value);
    saveSettings();
  });

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  loadSettings();
  loadChats();
  if (chats.length === 0) {
    createNewChat();
  } else {
    if (!activeChatId || !chats.find(c => c.id === activeChatId)) {
      activeChatId = chats[0].id;
    }
    renderChatList();
    renderActiveChat();
  }
  input.focus();
</script>
</body>
</html>
